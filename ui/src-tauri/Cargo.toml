[package]
name = "pymrst-studio"
version = "0.1.0"
description = "Professional PyMRST reservoir engineering application"
authors = ["PyMRST contributors"]
edition = "2021"

[lib]
name = "pymrst_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
url = "2"
