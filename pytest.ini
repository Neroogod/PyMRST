[pytest]
markers =
    validation: cross-checks against saved MATLAB reference data
    slow: example drivers that run a full simulation (minutes each)
testpaths = tests

# The default run is the fast one. `tests/test_all.py` has documented this
# since it was written -
#
#     pytest                # module self-tests (fast, no MATLAB needed)
#     pytest -m validation  # cross-checks against the saved MATLAB data
#
# - but the markers were only ever *declared*, never deselected, so a bare
# `pytest` also ran 143 example drivers on a 3600s timeout apiece. That is
# what made a full run take 1h41m, which is long enough that nobody runs it
# while working, which is how a suite stops catching things.
#
# A command-line `-m` overrides this one (addopts are prepended, and pytest
# takes the last `-m`), so `pytest -m slow` and `pytest -m validation` still
# select exactly those. `pytest -m ""` clears it and runs everything.
addopts = -m "not slow and not validation"
